<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ผูกบัญชี LINE</title>
<style>*{box-sizing:border-box}body{background:#f3f7f5;font:16px/1.7 Tahoma,sans-serif;color:#203a31;margin:0;padding:24px}main{max-width:440px;margin:8vh auto;background:white;border:1px solid #dfe8e2;border-radius:18px;padding:28px}h1{font-size:25px}label{display:block;margin-top:24px}input,button{width:100%;font:inherit;padding:13px;border-radius:9px;margin-top:8px}input{border:1px solid #baccc0}button{background:#06c755;color:white;border:0;font-weight:bold;cursor:pointer}a{color:#176b60}.message{background:#fff0e9;padding:14px;border-radius:8px}</style>
<main><h1>เชื่อมบัญชีนักเรียนกับ LINE</h1>
{% if message %}<p class="message" role="alert">{{ message }}</p>{% endif %}
{% if binding %}<p>ทำเพียงครั้งแรก ครั้งต่อไปกดเข้าสู่ระบบด้วย LINE ได้เลย</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="student_id">เลขประจำตัวนักเรียน</label><input id="student_id" name="student_id" inputmode="numeric" maxlength="64" required autofocus autocomplete="off" placeholder="เลขบนบัตรนักเรียน (ไม่ใช่เลขบัตรประชาชน)"><p><small>ใช้เลขประจำตัวของคุณเองเท่านั้น LINE นี้จะผูกกับบัญชีนักเรียนที่ตรงกับเลขที่กรอก</small></p><button type="submit">ยืนยันและผูกบัญชี</button></form>{% endif %}
<p><a href="/auth/line">เข้าสู่ระบบ LINE ใหม่</a> · <a href="/">กลับหน้าเข้าสู่ระบบ</a></p></main></html>
