<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ</title>
    <style>
        .login-card { 
            width: 360px; 
            margin: 40px auto; 
            padding: 25px; 
            border: 1px solid #e0e0e0; 
            border-radius: 16px; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            background: #fff; 
            position: relative;
            overflow: hidden;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-login:disabled, button:disabled {
            opacity: 0.75;
            cursor: not-allowed;
        }

        .role-tabs {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: #64748b;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #007bff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px; display: block; }
        .input-text { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 14px; 
            box-sizing: border-box;
            outline: none;
        }
        .input-text:focus { border-color: #007bff; }

        .pin-box-container { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .pin-box { width: 45px; height: 50px; font-size: 24px; text-align: center; border: 1px solid #ccc; border-radius: 8px; }
        select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; }
        label { font-weight: 600; color: #444; display: block; text-align: left; font-size: 14px; margin-top: 10px; }
        
        button.submit-btn { 
            width: 100%; padding: 12px; background-color: #007bff; color: white; 
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; 
        }
        button.submit-btn:hover { background-color: #0056b3; }
        
        .loading-bar { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background-color: #e0e0e0; display: none; }
        .loading-bar::before { content: ''; position: absolute; background-color: #007bff; top: 0; left: 0; bottom: 0; width: 40%; animation: moveBar 1.2s infinite ease-in-out; }
        @keyframes moveBar { 0% { left: -40%; width: 30%; } 50% { width: 60%; } 100% { left: 100%; width: 30%; } }
    </style>
</head>
<body>

<div class="login-card">
    <div id="loadingBar" class="loading-bar"></div>

    <!-- 1. ปุ่ม Switch Tab เลือกบทบาท -->
    <div class="role-tabs">
        <button class="tab-btn active" onclick="switchRole('student', event)">นักเรียน</button>
        <button class="tab-btn" onclick="switchRole('teacher', event)">อาจารย์</button>
        <button class="tab-btn" onclick="switchRole('admin', event)">แอดมิน</button>
    </div>

    <!-- 2. ฟอร์มสำหรับนักเรียน -->
    <div id="studentForm">
        <h3 style="margin-top:0; color:#007bff;">เข้าสู่ระบบนักเรียน</h3>
        <label for="classSelect">1. เลือกชั้นเรียน:</label>
        <select id="classSelect" onchange="loadStudentsByClass()">
            <option value="">-- กรุณาเลือกชั้นเรียน --</option>
            {% for c in classes %}
                <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>

        <label for="studentSelect">2. เลือกชื่อ-นามสกุล:</label>
        <select id="studentSelect" onchange="focusPinBox()" disabled>
            <option value="">-- กรุณาเลือกชั้นเรียนก่อน --</option>
        </select>

        <label>3. รหัสผ่าน (เลข 4 ตัวท้าย):</label>
        <div class="pin-box-container">
            <input type="password" maxlength="1" class="pin-box" id="pin1" oninput="moveFocus(this, 'pin2')">
            <input type="password" maxlength="1" class="pin-box" id="pin2" oninput="moveFocus(this, 'pin3')" onkeydown="checkBackspace(event, 'pin1')">
            <input type="password" maxlength="1" class="pin-box" id="pin3" oninput="moveFocus(this, 'pin4')" onkeydown="checkBackspace(event, 'pin2')">
            <input type="password" maxlength="1" class="pin-box" id="pin4" oninput="moveFocus(this, null)" onkeydown="checkBackspace(event, 'pin3')">
        </div>
        <button class="submit-btn" onclick="submitLogin()">เข้าสู่ระบบ</button>
    </div>

    <!-- 3. ฟอร์มสำหรับอาจารย์ / แอดมิน -->
    <div id="staffForm" style="display: none;">
        <h3 id="staffTitle" style="margin-top:0; color:#007bff;">เข้าสู่ระบบอาจารย์</h3>
        
        <div class="form-group">
            <label>ชื่อผู้ใช้งาน / อีเมล:</label>
            <input type="text" id="staffUsername" class="input-text" placeholder="กรอก Username หรือ Email">
        </div>

        <div class="form-group">
            <label>รหัสผ่าน:</label>
            <input type="password" id="staffPassword" class="input-text" placeholder="กรอกรหัสผ่าน">
        </div>

        <!-- 🟢 แก้ไข onclick ให้เรียก loginStaff() -->
        <button id="staffSubmitBtn" class="submit-btn" onclick="loginStaff()">เข้าสู่ระบบ</button>
    </div>
</div>

<script>
    let currentRole = 'student';
    // 🟢 แก้ไขโดยเติม | safe ป้องกัน Syntax Error
    const allStudentsData = {{ all_students | tojson | safe }};

    function switchRole(role, evt) {
        currentRole = role;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (evt) evt.target.classList.add('active');
        
        if (role === 'student') {
            document.getElementById('studentForm').style.display = 'block';
            document.getElementById('staffForm').style.display = 'none';
        } else {
            document.getElementById('studentForm').style.display = 'none';
            document.getElementById('staffForm').style.display = 'block';
            
            const title = document.getElementById('staffTitle');
            const btn = document.getElementById('staffSubmitBtn');
            if (role === 'teacher') {
                title.textContent = 'เข้าสู่ระบบอาจารย์';
                title.style.color = '#007bff';
                btn.style.backgroundColor = '#007bff';
            } else {
                title.textContent = 'เข้าสู่ระบบแอดมิน';
                title.style.color = '#dc3545';
                btn.style.backgroundColor = '#dc3545';
            }
        }
    }

    // 🟢 ฟังก์ชันยิง Login สำหรับ อาจารย์/แอดมิน
    function loginStaff() {
        const btn = document.getElementById('staffSubmitBtn');
        const originalText = btn.innerHTML;

        const username = document.getElementById('staffUsername').value.trim();
        const password = document.getElementById('staffPassword').value.trim();

        if (!username || !password) {
            alert('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> กำลังเข้าสู่ระบบ...`;

        fetch('/login_staff', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role: currentRole, username: username, password: password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                window.location.href = data.redirect_url;
            } else {
                alert(data.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        })
        .catch(err => {
            console.error(err);
            alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
            btn.disabled = false;
            btn.innerHTML = originalText;
        });
    }

    function loadStudentsByClass() {
        const selectedClass = document.getElementById('classSelect').value;
        const studentSelect = document.getElementById('studentSelect');
        studentSelect.innerHTML = '';
        if (!selectedClass) {
            studentSelect.innerHTML = '<option value="">-- กรุณาเลือกชั้นเรียนก่อน --</option>';
            studentSelect.disabled = true;
            return;
        }
        const filtered = allStudentsData.filter(s => s.class === selectedClass);
        if (filtered.length > 0) {
            studentSelect.innerHTML = '<option value="">-- กรุณาเลือกชื่อ-นามสกุล --</option>';
            filtered.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.name;
                opt.textContent = s.name;
                studentSelect.appendChild(opt);
            });
            studentSelect.disabled = false;
        }
    }

    function focusPinBox() {
        if (document.getElementById('studentSelect').value !== "") {
            document.getElementById('pin1').focus();
        }
    }

    function moveFocus(current, nextId) {
        if (current.value.length >= 1) {
            if (nextId) {
                document.getElementById(nextId).focus();
            } else {
                const p1 = document.getElementById('pin1').value;
                const p2 = document.getElementById('pin2').value;
                const p3 = document.getElementById('pin3').value;
                const p4 = document.getElementById('pin4').value;
                if (p1 && p2 && p3 && p4) submitLogin();
            }
        }
    }

    function checkBackspace(event, prevId) {
        if (event.key === "Backspace" && event.target.value === "") {
            document.getElementById(prevId).focus();
        }
    }

    function submitLogin() {
        const studentName = document.getElementById('studentSelect').value;
        const fullPin = document.getElementById('pin1').value + document.getElementById('pin2').value + document.getElementById('pin3').value + document.getElementById('pin4').value;

        if (!studentName || fullPin.length < 4) {
            alert('กรุณากรอกข้อมูลให้ครบถ้วน');
            return;
        }

        fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullname: studentName, pin: fullPin })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) window.location.href = '/dashboard';
            else alert(data.message);
        });
    }
</script>

</body>
</html>
