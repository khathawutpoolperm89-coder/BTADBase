<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #e8f1ff, #f6f9ff); font-family: 'Sarabun', sans-serif; color: #333;
    padding: 16px;
  }
  .card {
    background: #fff; width: 100%; max-width: 480px; border-radius: 24px;
    padding: 36px 24px 40px; box-shadow: 0 10px 40px rgba(0, 80, 200, .12); text-align: center;
  }
  h2 { color: #1a82ff; font-size: 26px; margin: 0 0 8px; }
  p { color: #777; margin: 0 0 28px; font-size: 16px; }
  .line-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 15px; border-radius: 10px; border: 0; cursor: pointer;
    background: #06c755; color: #fff; font: 700 20px 'Sarabun', sans-serif; text-decoration: none;
  }
  .line-btn:hover { background: #05b34c; }
  .line-btn svg { width: 26px; height: 26px; fill: #fff; }
</style>
</head>
<body>
<div class="card">
  <h2>เข้าสู่ระบบ</h2>
  <p>กรุณาเข้าสู่ระบบด้วยบัญชี LINE ของคุณ</p>

  <!-- ปรับ href ให้ตรงกับ route ใน line_auth.py -->
  <a class="line-btn" href="/line/login">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 5.58 2 10c0 3.95 3.55 7.26 8.35 7.88.33.07.77.22.88.5.1.25.07.65.03.9l-.14.85c-.04.25-.2.98.86.53 1.06-.45 5.7-3.36 7.78-5.75C21.15 12.9 22 11.5 22 10c0-4.42-4.48-8-10-8z"/></svg>
    เข้าสู่ระบบด้วย LINE
  </a>
</div>
</body>
</html>
